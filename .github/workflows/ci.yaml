name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
  - cron: "0 5 * * 0"
  workflow_dispatch:


# Cancel any in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: CI
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -l {0}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Pixi
      uses: prefix-dev/setup-pixi@v0.11.2
      with:
        environments: test
        cache: true
        cache-write: ${{ github.event_name == 'push' && github.ref_name == 'master' }}

    - name: Run unit tests
      run: |
        pixi run unit-tests

    - name: Test snakemake workflows
      run: |
        pixi run integration-tests

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: technology-data
        path: outputs/

    - name: Check for differences in generated outputs
      run: |-
        git config --global --add safe.directory $GITHUB_WORKSPACE
        git add outputs/
        if ! git diff --cached --quiet; then
          echo 'Generated outputs differ from the branch. Please rerun "pixi run integration-tests" and commit the changes to the outputs/*.csv files.'
          git diff --cached
          exit 1
        else
          echo "No differences found in generated outputs."
        fi
